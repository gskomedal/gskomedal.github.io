name: Sync from Labyrint-Hero

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout gskomedal.github.io
        uses: actions/checkout@v4
        with:
          path: site

      - name: Checkout Labyrint-Hero (public repo, no token needed)
        uses: actions/checkout@v4
        with:
          repository: gskomedal/Labyrint-Hero
          path: game

      - name: Copy game files
        run: |
          cp game/index.html site/index.html
          cp game/simulator.html site/simulator.html

          rm -rf site/src
          cp -r game/src site/src

          rm -rf site/config
          cp -r game/config site/config

          rm -rf site/docs
          cp -r game/docs site/docs

          touch site/.nojekyll

      - name: Commit and push if changed
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            COMMIT=$(git -C ../game rev-parse --short HEAD)
            git commit -m "Deploy from Labyrint-Hero@${COMMIT}"
            git push
          fi
